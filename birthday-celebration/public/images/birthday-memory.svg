<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b2b"/>
      <stop offset=".5" stop-color="#4c1d65"/>
      <stop offset="1" stop-color="#0b2435"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f9a8d4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="450" cy="280" r="250" fill="url(#glow)" opacity=".45"/>

  <g fill="#fff">
    <circle cx="110" cy="100" r="3"/>
    <circle cx="180" cy="190" r="2"/>
    <circle cx="760" cy="120" r="3"/>
    <circle cx="700" cy="210" r="2"/>
    <circle cx="820" cy="400" r="3"/>
    <circle cx="90" cy="430" r="2"/>
  </g>

  <g transform="translate(300 250)">
    <ellipse cx="150" cy="180" rx="220" ry="35" fill="#000" opacity=".25"/>
    <rect x="15" y="80" width="270" height="100" rx="18" fill="#d946ef"/>
    <rect x="35" y="30" width="230" height="70" rx="16" fill="#ec4899"/>
    <rect x="65" y="-15" width="170" height="60" rx="14" fill="#f472b6"/>

    <g fill="#ffd166">
      <ellipse cx="105" cy="-45" rx="11" ry="18"/>
      <ellipse cx="150" cy="-45" rx="11" ry="18"/>
      <ellipse cx="195" cy="-45" rx="11" ry="18"/>
    </g>

    <g stroke="#fff" stroke-width="6" stroke-linecap="round">
      <path d="M105-28v45"/>
      <path d="M150-28v45"/>
      <path d="M195-28v45"/>
    </g>
  </g>

  <text x="450" y="535"
        text-anchor="middle"
        fill="white"
        font-family="Georgia,serif"
        font-size="34"
        font-style="italic">
    A little birthday memory
  </text>
</svg>
